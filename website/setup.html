<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Setup | OffPay</title>
  <meta name="description" content="Setup guide for OffPay: Android APK and PWA." />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" type="image/png" href="assets/logos/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #000000; --surface: #0E0F12; --surface-hi: #16181D;
      --border: #2A2D34; --border-s: #3A3E47;
      --text-1: #FFFFFF; --text-2: #9BA1A8; --text-3: #5A6068;
      --lime: #C5F542; --lime-dim: #8AAB2C;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --max: 960px; --pad: clamp(16px, 4.5vw, 48px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; width: 100%; scroll-behavior: smooth; }
    body { background: var(--black); color: var(--text-1); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; width: 100%; position: relative; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--lime); color: var(--black); }
    .w { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
    .divider { border: none; border-top: 1px solid var(--border); }
    .label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em; color: var(--lime); text-transform: uppercase; display: block; margin-bottom: 14px; }
    .lime { color: var(--lime); }

    nav {
      position: sticky; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--pad); height: 60px;
      height: calc(60px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(0,0,0,0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .nav-brand img { width: 44px; height: 44px; }
    .nav-links { display: flex; gap: 24px; margin: 0 auto; font-size: 13px; font-weight: 500; color: var(--text-2); }
    .nav-links a:hover { color: var(--text-1); } .nav-links a.active { color: var(--lime); }
    .nav-dl { font-size: 12px; font-weight: 700; background: var(--lime); color: var(--black); padding: 10px 16px; min-height: 40px; box-shadow: 2px 2px 0 var(--lime-dim); transition: box-shadow 80ms, transform 80ms, opacity 180ms ease; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .nav-dl:hover { box-shadow: 3px 3px 0 var(--lime-dim); transform: translate(-1px,-1px); }

    .nav-star {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      background: var(--surface-hi);
      transition: border-color 150ms, background-color 150ms, transform 80ms;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .nav-star:hover {
      border-color: #ffb300;
      background: rgba(255,179,0,0.08);
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 rgba(255,179,0,0.2);
    }
    .nav-star:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    
    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 14px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 210;
    }
    .menu-toggle .bar {
      width: 100%;
      height: 2px;
      background-color: var(--text-1);
      transition: all 0.2s ease-in-out;
    }
    .mobile-menu {
      position: fixed;
      top: calc(60px + env(safe-area-inset-top, 0px));
      left: 0;
      width: 100%;
      height: calc(100vh - (60px + env(safe-area-inset-top, 0px)));
      background: rgba(13,13,13,0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 190;
      display: flex;
      flex-direction: column;
      padding: 40px var(--pad);
      transform: translateY(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu.active {
      transform: translateY(0);
    }
    .mobile-menu-links {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .mobile-menu-links a {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-2);
      text-transform: capitalize;
      letter-spacing: -0.02em;
      transition: color 0.2s ease;
    }
    .mobile-menu-links a:hover,
    .mobile-menu-links a.active {
      color: var(--lime);
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .menu-toggle { display: flex; }
      .menu-toggle.active .bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
      .menu-toggle.active .bar:nth-child(2) { opacity: 0; }
      .menu-toggle.active .bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
      .nav-dl {
        font-size: 11px;
        padding: 8px 12px;
        min-height: 34px;
      }
      body.menu-open .nav-dl {
        opacity: 0;
        pointer-events: none;
      }
      .foot-in {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
      }
      .foot-links {
        justify-content: center;
        gap: 16px 20px;
      }
    }

    .page-hero { padding: clamp(64px, 9vw, 104px) 0 clamp(36px, 5vw, 56px); }
    .page-hero h1 { font-size: clamp(28px, 7vw, 76px); font-weight: 800; letter-spacing: -0.04em; line-height: 0.95; color: var(--text-1); margin-bottom: 12px; }
    .page-hero p { font-size: 15px; color: var(--text-2); max-width: 50ch; line-height: 1.7; }

    .setup-section { padding: clamp(36px, 5vw, 64px) 0; }
    .section-title { font-size: clamp(20px, 3vw, 32px); font-weight: 800; letter-spacing: -0.03em; color: var(--text-1); margin-bottom: 20px; }

    .video-wrap {
      border: 1px solid var(--border); box-shadow: 5px 5px 0 var(--border);
      background: var(--surface); aspect-ratio: 16/9;
      position: relative; cursor: pointer; overflow: hidden;
    }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
    .video-facade { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface); z-index: 2; transition: opacity 180ms; }
    .video-facade.gone { opacity: 0; pointer-events: none; }
    .video-facade img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.28; }
    
    .play-ring {
      position: relative;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: rgba(0,0,0,0.76);
      border: 2px solid var(--lime);
      display: flex; align-items: center; justify-content: center;
      color: var(--lime);
      transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
    }
    .video-facade:hover .play-ring {
      transform: scale(1.1);
      background: var(--lime);
      color: var(--black);
    }

    footer { background: var(--surface); border-top: 1px solid var(--border); padding: 32px var(--pad); }
    .foot-in { max-width: var(--max); margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px; }
    .foot-brand { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .foot-brand img { width: 30px; height: 30px; }
    .foot-links { display: flex; flex-wrap: wrap; gap: 20px; font-size: 12px; color: var(--text-3); font-weight: 500; }
    .foot-links a:hover { color: var(--text-1); }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">
    <img src="assets/logos/icon.png" alt="OffPay" />
    <span><span class="lime">Off</span>Pay</span>
  </a>
  <div class="nav-links">
    <a href="index.html#demo">Demo</a>
    <a href="index.html#features">Features</a>
    <a href="index.html#pwa">PWA</a>
    <a href="setup.html" class="active">Setup</a>
    <a href="faq.html">FAQ</a>
    <a href="about.html">About</a>
  </div>
  <div class="nav-right">
    <a href="https://github.com/laksh-ya/offpayapp" target="_blank" rel="noopener" class="nav-star" aria-label="Star on GitHub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ffb300;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/></svg>
    </a>
    <a href="index.html#download" class="nav-dl">Download</a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu" id="mobile-menu">
  <div class="mobile-menu-links">
    <a href="index.html#demo">Demo</a>
    <a href="index.html#features">Features</a>
    <a href="index.html#pwa">PWA</a>
    <a href="setup.html" class="active">Setup</a>
    <a href="faq.html">FAQ</a>
    <a href="about.html">About</a>
  </div>
</div>

<!-- Hero -->
<section class="page-hero">
  <div class="w">
    <span class="label">Setup</span>
    <h1>Get it<br/><span class="lime">running.</span></h1>
    <p>Watch the guide for your platform. Android takes about 2 minutes.</p>
  </div>
</section>

<hr class="divider" />

<!-- Android setup video -->
<section class="setup-section">
  <div class="w">
    <span class="label">Android</span>
    <div class="section-title">Android setup guide</div>
    <div class="video-wrap" data-yt="0OeFCC7kwXc">
      <div class="video-facade">
        <img src="https://img.youtube.com/vi/0OeFCC7kwXc/maxresdefault.jpg" alt="" loading="lazy" />
        <div class="play-ring">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

    <div class="video-wrap" data-yt="77hXVXdOT78">
      <div class="video-facade">
        <img src="https://img.youtube.com/vi/77hXVXdOT78/maxresdefault.jpg" alt="" loading="lazy" />
        <div class="play-ring">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

<footer>
  <div class="foot-in">

      <img src="assets/logos/icon.png" alt="" />
      <span><span class="lime">Off</span>Pay</span>
    </a>
    <div class="foot-links">
      <a href="setup.html">Setup</a>
      <a href="faq.html">FAQ</a>

<script>
  document.querySelectorAll('.video-wrap[data-yt]').forEach(wrap => {
    wrap.querySelector('.video-facade').addEventListener('click', () => {
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${wrap.dataset.yt}?autoplay=1&rel=0`;
      iframe.title = 'OffPay setup guide'; iframe.allowFullscreen = true;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      wrap.appendChild(iframe);
      wrap.querySelector('.video-facade').classList.add('gone');
    }, { once: true });
  });

  // Mobile menu toggle logic
  const menuToggle = document.getElementById('menu-toggle');
  const mobileMenu = document.getElementById('mobile-menu');
  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', () => {
      menuToggle.classList.toggle('active');
      mobileMenu.classList.toggle('active');
      const isActive = mobileMenu.classList.contains('active');
      document.body.style.overflow = isActive ? 'hidden' : '';
      if (isActive) {
        document.body.classList.add('menu-open');
      } else {
        document.body.classList.remove('menu-open');
      }
    });
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.classList.remove('menu-open');
        document.body.style.overflow = '';
      });
    });
  }
</script>

</body>
